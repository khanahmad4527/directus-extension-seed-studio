name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hosted runners are UTC, which hid a bug where timezone-naive columns
      # were serialised through toISOString(): parse-then-format shifted the
      # wall clock by the server's offset everywhere except UTC. A second
      # non-UTC run keeps that class of bug visible.
      - name: Run unit tests (UTC)
        run: pnpm test
        env:
          TZ: UTC

      - name: Run unit tests (non-UTC)
        run: pnpm test
        env:
          TZ: Pacific/Chatham

      - name: Build extension
        run: pnpm build
