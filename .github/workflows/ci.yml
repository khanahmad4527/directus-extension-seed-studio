name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in package.json; passing it here
      # as well is an error in v5+.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hosted runners are UTC, which hid a bug where timezone-naive columns
      # were serialised through toISOString(): parse-then-format shifted the
      # wall clock by the server's offset everywhere except UTC. A second
      # non-UTC run keeps that class of bug visible.
      - name: Run unit tests (UTC)
        run: pnpm test
        env:
          TZ: UTC

      - name: Run unit tests (non-UTC)
        run: pnpm test
        env:
          TZ: Pacific/Chatham

      - name: Build extension
        run: pnpm build
