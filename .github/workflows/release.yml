name: Release

# Publishing to npm is deliberately NOT automated. No npm token is kept in this
# repository's secrets, so a tag push tests, builds, and creates the GitHub
# Release — the npm publish is done by hand:
#
#   git tag -a vX.Y.Z -m "<release notes>"
#   git push origin main && git push origin vX.Y.Z
#   pnpm build && npm publish --access public
#
# Release notes live in the annotated tag; `--notes-from-tag` below is what
# puts them on the Release page, so write them there rather than in a file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # for GitHub Release creation

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two timezones, matching ci.yml: hosted runners are UTC, which once hid
      # a bug where timezone-naive columns were serialised through
      # toISOString() and shifted the wall clock everywhere else.
      - name: Run unit tests (UTC)
        run: pnpm test
        env:
          TZ: UTC

      - name: Run unit tests (non-UTC)
        run: pnpm test
        env:
          TZ: Pacific/Chatham

      - name: Build extension
        run: pnpm build

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--notes-from-tag` reads the annotated tag object, which a shallow
          # clone of the tagged commit does not include.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-from-tag \
            --title "${GITHUB_REF_NAME}" \
            dist/api.js dist/app.js
