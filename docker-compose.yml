services:
  database:
    image: postgis/postgis:13-master
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "directus" ]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:6

  directus:
    image: directus/directus:latest
    ports:
      - "8055:8055"
    volumes:
      - directus-uploads:/directus/uploads
      - ./dist:/directus/extensions/directus-extension-seed-studio/dist
      - ./package.json:/directus/extensions/directus-extension-seed-studio/package.json
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      SECRET: "replace-with-random-secret"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "d1r3ctu5"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus"
      CACHE_ENABLED: "false"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"
      EXTENSIONS_AUTO_RELOAD: "true"
      WEBSOCKETS_ENABLED: "true"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:8055/server/health | grep -q '\"status\":\"ok\"' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  seed:
    image: node:20-alpine
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
    entrypoint: [ "node", "/seed/init.mjs" ]
    environment:
      DIRECTUS_URL: "http://directus:8055"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "d1r3ctu5"
    restart: "no"

volumes:
  database-data:
  directus-uploads:
